name: Test Configure AWS Credential
on:
  push:
    branches:
      - main  # Triggers the pipeline when code is pushed to the main branch
  pull_request:
    branches:
      - main  # Runs Terraform Plan for pull requests
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  Test-OIDC-Connection:
    runs-on: ubuntu-latest

    steps:
      - name: Debug OIDC Token Claims
        env:
          AUDIENCE: "sts.amazonaws.com"
        run: |
          TOKEN_JSON=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE")
          ID_TOKEN=$(echo "$TOKEN_JSON" | jq -r .value)
          echo "Decoded JWT Payload:"
          echo "$ID_TOKEN" | awk -F. '{print $2}' | base64 -d 2>/dev/null | jq .
      - name: AWS Authorization
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-east-1
          #role-to-assume: ${{ secrets.ROLE_TO_ASSUME }}
          role-to-assume: ${{ secrets.OIDC_ROLE_TO_ASSUME }}
      - name: Get Authentication Token
        run: aws sts get-caller-identity
